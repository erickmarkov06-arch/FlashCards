# Runs on every push to main:
#   1. checks every deck (fails loudly if one is broken, and the live site stays as it was)
#   2. regenerates decks/index.json and commits it if it changed
#   3. publishes the site to GitHub Pages
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Build index and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to commit the regenerated decks/index.json
  pages: write # to publish to GitHub Pages
  id-token: write # required by actions/deploy-pages

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate decks
        run: node scripts/validate.js

      - name: Rebuild decks/index.json
        run: node scripts/build-index.js

      - name: Commit the index if it changed
        run: |
          if git diff --quiet -- decks/index.json; then
            echo "decks/index.json is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add decks/index.json
            git commit -m "Update decks/index.json [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
