<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="Arial, Helvetica, sans-serif">
  <title>A wave type with high height, short wavelength, weak swash and strong backwash</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f3a5f"/></marker></defs>
  <rect width="480" height="240" fill="#ffffff"/>
  <path d="M0 120 Q40 70 80 110 Q120 60 170 105 Q220 50 270 100 Q300 60 330 85 Q310 80 305 100 L350 140 L350 240 L0 240 Z" fill="#9fb8cf"/>
  <path d="M0 215 Q200 200 300 160 Q360 120 480 90 L480 240 L0 240 Z" fill="#f2d16b" stroke="#b8962e" stroke-width="2"/>
  <g fill="#7a5c1e"><circle cx="90" cy="200" r="3"/><circle cx="104" cy="204" r="3"/><circle cx="118" cy="199" r="3"/><circle cx="132" cy="203" r="3"/><circle cx="146" cy="198" r="3"/><circle cx="110" cy="208" r="3"/></g>
  <line x1="320" y1="115" x2="350" y2="105" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
  <text x="345" y="85" font-size="14" fill="#1f3a5f">weak swash</text>
  <line x1="320" y1="160" x2="190" y2="190" stroke="#1f3a5f" stroke-width="5" marker-end="url(#ah)"/>
  <text x="215" y="225" font-size="14" fill="#1f3a5f">strong backwash</text>
  <text x="20" y="30" font-size="15" fill="#333">steep beach, material dragged out to sea</text>
</svg>
