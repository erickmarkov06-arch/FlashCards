<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" font-family="Arial, Helvetica, sans-serif">
  <title>The three types of coral reef labelled A, B and C, seen from above</title>
  <rect width="600" height="240" fill="#ffffff"/>
  <g>
    <rect x="10" y="20" width="180" height="180" fill="#9fc3e6"/>
    <circle cx="100" cy="110" r="55" fill="#e07a5f"/>
    <circle cx="100" cy="110" r="45" fill="#b48a5a"/>
    <circle cx="100" cy="110" r="45" fill="none" stroke="#f2d16b" stroke-width="3"/>
  </g>
  <g>
    <rect x="210" y="20" width="180" height="180" fill="#9fc3e6"/>
    <circle cx="300" cy="110" r="78" fill="none" stroke="#e07a5f" stroke-width="12"/>
    <circle cx="300" cy="110" r="64" fill="#c6e2f2"/>
    <circle cx="300" cy="110" r="38" fill="#b48a5a"/>
  </g>
  <g>
    <rect x="410" y="20" width="180" height="180" fill="#9fc3e6"/>
    <circle cx="500" cy="110" r="70" fill="none" stroke="#e07a5f" stroke-width="12"/>
    <circle cx="500" cy="110" r="58" fill="#c6e2f2"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#ffffff">
    <rect x="18" y="28" width="24" height="24" fill="#1f3a5f"/><text x="30" y="46" text-anchor="middle">A</text>
    <rect x="218" y="28" width="24" height="24" fill="#1f3a5f"/><text x="230" y="46" text-anchor="middle">B</text>
    <rect x="418" y="28" width="24" height="24" fill="#1f3a5f"/><text x="430" y="46" text-anchor="middle">C</text>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="100" y="222">reef right next to the shore</text>
    <text x="300" y="222">reef separated by a lagoon</text>
    <text x="500" y="222">ring of reef, island has sunk</text>
  </g>
  <g font-size="11" fill="#555"><text x="440" y="115">lagoon</text></g>
</svg>
