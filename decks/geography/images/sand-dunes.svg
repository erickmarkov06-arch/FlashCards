<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Arial, Helvetica, sans-serif">
  <title>Sand dune succession from the sea inland, with dunes labelled A to F</title>
  <rect width="600" height="260" fill="#ffffff"/>
  <rect x="0" y="190" width="40" height="70" fill="#9fc3e6"/>
  <text x="6" y="250" font-size="13" fill="#1f3a5f" font-weight="bold">SEA</text>
  <path d="M40 200 Q60 188 80 196 Q120 160 160 194 Q215 110 270 190 Q330 140 380 196 Q410 205 440 200 Q500 150 560 180 L600 175 L600 260 L40 260 Z" fill="#f2d16b" stroke="#b8962e" stroke-width="2"/>
  <path d="M270 190 Q330 140 380 196 L380 260 L270 260 Z" fill="#cfc29a"/>
  <path d="M440 200 Q500 150 560 180 L600 175 L600 260 L440 260 Z" fill="#b9a678"/>
  <g stroke="#3d7a3a" stroke-width="2" fill="none">
    <path d="M150 182 l-4 -10 M156 180 l0 -12 M162 182 l4 -10"/>
    <path d="M205 130 l-4 -12 M212 126 l0 -14 M219 130 l4 -12"/>
    <path d="M300 162 l-3 -8 M306 158 l0 -10 M325 152 l0 -10 M345 160 l3 -8"/>
  </g>
  <rect x="393" y="197" width="44" height="6" fill="#7fb3d8"/>
  <g stroke="#5a3e1b" stroke-width="4"><line x1="505" y1="150" x2="505" y2="168"/><line x1="535" y1="156" x2="535" y2="172"/><line x1="570" y1="160" x2="570" y2="176"/></g>
  <g fill="#2f6b2c"><circle cx="505" cy="140" r="14"/><circle cx="535" cy="146" r="12"/><circle cx="570" cy="150" r="13"/></g>
  <g font-size="18" font-weight="bold" fill="#ffffff">
    <rect x="68" y="150" width="24" height="24" fill="#1f3a5f"/><text x="80" y="168" text-anchor="middle">A</text>
    <rect x="148" y="125" width="24" height="24" fill="#1f3a5f"/><text x="160" y="143" text-anchor="middle">B</text>
    <rect x="203" y="75" width="24" height="24" fill="#1f3a5f"/><text x="215" y="93" text-anchor="middle">C</text>
    <rect x="315" y="110" width="24" height="24" fill="#1f3a5f"/><text x="327" y="128" text-anchor="middle">D</text>
    <rect x="403" y="215" width="24" height="24" fill="#1f3a5f"/><text x="415" y="233" text-anchor="middle">E</text>
    <rect x="525" y="98" width="24" height="24" fill="#1f3a5f"/><text x="537" y="116" text-anchor="middle">F</text>
  </g>
  <text x="300" y="22" font-size="13" fill="#555" text-anchor="middle">sea → inland: dunes get older, more vegetated and more acidic</text>
</svg>
