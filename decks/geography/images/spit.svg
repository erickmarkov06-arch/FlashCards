  <rect width="500" height="300" fill="#9fc3e6"/>
  <path d="M0 0 L290 0 L290 300 L0 300 Z" fill="#b48a5a"/>
  <path d="M0 0 L500 0 L500 0 Z" fill="#b48a5a"/>
  <path d="M0 0 L290 0 L290 70 L0 70 Z" fill="#9fc3e6"/>
  <path d="M0 70 L290 70 L290 82 L0 82 Z" fill="#f2d16b"/>
  <path d="M286 72 Q380 80 430 108 Q458 124 452 150 Q440 156 434 136 Q420 118 330 98 L290 96 Z" fill="#f2d16b" stroke="#b8962e" stroke-width="2"/>
  <path d="M292 100 Q360 108 420 136 Q410 175 340 175 L292 160 Z" fill="#8fbf7a"/>
