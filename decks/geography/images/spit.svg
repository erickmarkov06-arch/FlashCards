  <text x="400" y="260" font-size="16" fill="#1f3a5f" font-weight="bold">SEA</text>
  <text x="300" y="250" font-size="12" fill="#1f3a5f">coastline changes</text>
  <text x="300" y="265" font-size="12" fill="#1f3a5f">direction here</text>
