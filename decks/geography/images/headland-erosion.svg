<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Eroding headland with features labelled A to F</title>
  <rect width="560" height="300" fill="#e8f1fa"/>
  <path d="M10 60 L330 60 L330 230 L10 230 Z" fill="#d9cdb4" stroke="#7a6a4f" stroke-width="2"/>
  <path d="M330 60 L540 60 L540 230" fill="none" stroke="#7a6a4f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="50" font-size="12" fill="#555">original headland</text>
  <path d="M60 230 L66 200 L58 178 L64 150" fill="none" stroke="#5a4a32" stroke-width="3"/>
  <path d="M120 230 Q120 185 150 185 Q180 185 180 230 Z" fill="#4d5b66"/>
  <path d="M235 230 Q235 150 275 150 Q315 150 315 230 Z" fill="#e8f1fa"/>
  <path d="M370 230 L374 95 L410 92 L414 230 Z" fill="#d9cdb4" stroke="#7a6a4f" stroke-width="2"/>
  <path d="M460 230 Q462 205 480 200 Q498 205 500 230 Z" fill="#d9cdb4" stroke="#7a6a4f" stroke-width="2"/>
  <rect x="0" y="230" width="560" height="70" fill="#9fc3e6"/>
