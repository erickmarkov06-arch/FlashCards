    <rect x="138" y="150" width="24" height="24" fill="#1f3a5f"/><text x="150" y="168" text-anchor="middle">B</text>
    <rect x="263" y="118" width="24" height="24" fill="#1f3a5f"/><text x="275" y="136" text-anchor="middle">C</text>
    <rect x="380" y="62" width="24" height="24" fill="#1f3a5f"/><text x="392" y="80" text-anchor="middle">D</text>
    <rect x="468" y="170" width="24" height="24" fill="#1f3a5f"/><text x="480" y="188" text-anchor="middle">E</text>
    <rect x="505" y="258" width="24" height="24" fill="#1f3a5f"/><text x="517" y="276" text-anchor="middle">F</text>
