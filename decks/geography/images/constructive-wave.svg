<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="Arial, Helvetica, sans-serif">
  <title>A wave type with low height, long wavelength, strong swash and weak backwash</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f3a5f"/></marker></defs>
  <rect width="480" height="240" fill="#ffffff"/>
  <path d="M0 140 Q60 120 120 138 Q180 120 240 135 Q300 118 340 130 L480 100 L480 240 L0 240 Z" fill="#9fb8cf"/>
  <path d="M0 200 L480 95 L480 240 L0 240 Z" fill="#f2d16b" stroke="#b8962e" stroke-width="2"/>
  <g fill="#7a5c1e"><circle cx="400" cy="118" r="3"/><circle cx="412" cy="112" r="3"/><circle cx="425" cy="115" r="3"/><circle cx="438" cy="108" r="3"/><circle cx="450" cy="111" r="3"/><circle cx="420" cy="122" r="3"/><circle cx="445" cy="118" r="3"/></g>
  <line x1="300" y1="112" x2="420" y2="92" stroke="#1f3a5f" stroke-width="5" marker-end="url(#ah)"/>
  <text x="300" y="80" font-size="14" fill="#1f3a5f">strong swash</text>
  <line x1="330" y1="150" x2="290" y2="158" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
  <text x="180" y="175" font-size="14" fill="#1f3a5f">weak backwash</text>
  <text x="20" y="30" font-size="15" fill="#333">gentle beach, material built up at the top</text>
</svg>
