<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Arial, Helvetica, sans-serif">
  <title>Plan view of a discordant coastline with headlands of hard rock and a bay of soft rock</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f3a5f"/></marker></defs>
  <rect width="480" height="320" fill="#9fc3e6"/>
  <path d="M0 0 L120 0 L120 210 L0 210 Z" fill="#a7a7a7"/>
  <path d="M120 0 L360 0 L360 210 Q240 90 120 210 Z" fill="#d9b779"/>
  <path d="M360 0 L480 0 L480 210 L360 210 Z" fill="#a7a7a7"/>
  <path d="M120 0 L120 210 M360 0 L360 210" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="60" y="40">hard rock</text><text x="60" y="58">(limestone/chalk)</text>
    <text x="240" y="40">soft rock (clay)</text>
    <text x="420" y="40">hard rock</text><text x="420" y="58">(limestone/chalk)</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="60" y="190">HEADLAND</text><text x="420" y="190">HEADLAND</text><text x="240" y="125">BAY</text>
  </g>
  <g stroke="#1f3a5f" stroke-width="4" marker-end="url(#ah)">
    <line x1="80" y1="295" x2="80" y2="235"/><line x1="240" y1="295" x2="240" y2="235"/><line x1="400" y1="295" x2="400" y2="235"/>
  </g>
  <text x="240" y="314" font-size="13" fill="#1f3a5f" text-anchor="middle">wave direction</text>
</svg>
